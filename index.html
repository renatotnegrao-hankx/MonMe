:root{
  --p:#0B4DB8; --p2:#6E9BE6; --pl:#EAF1FD; --ac:#FE6201; --yl:#FFC20E; --bg:#F6F8FC; --card:#fff; --lav:#B9A7DA;
  --tx:#1F2A44; --mu:#7A8599; --li:#E4E9F2; --ok:#2FA36B; --warn:#FFC20E; --bad:#E5484D; --blue:#9DB4E6;
  --serif:Quicksand,-apple-system,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font-family:Quicksand,-apple-system,Roboto,sans-serif;font-size:16px;font-weight:400}
body{background:radial-gradient(circle at 0% 0%,#FFE6D3 0,transparent 38%),radial-gradient(circle at 100% 18%,#E3EDFD 0,transparent 32%),var(--bg);min-height:100vh}
b,strong{font-weight:600}
h1,h2{font-family:var(--serif);font-weight:600;letter-spacing:-.3px}
h1{font-size:34px;line-height:1.15}
h3{font-weight:600}
body{overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{font:inherit;color:var(--tx)}
#app{max-width:520px;margin:0 auto;min-height:100vh;position:relative}
.scr{padding:16px 16px 120px}
.top{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.top h1{font-size:28px;margin:0;font-weight:600;font-family:var(--serif)}
.top .r{display:flex;gap:12px;align-items:center}
.streak{display:flex;align-items:center;gap:4px;font-weight:500;font-size:19px;color:var(--p)}
.bar{display:flex;align-items:center;gap:12px;padding:4px 0 16px}
.bar h2{flex:1;text-align:center;margin:0 44px 0 0;font-size:26px;font-weight:500}
.round{width:44px;height:44px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 12px rgba(11,77,184,.12);flex:none;color:var(--p)}
.card{background:var(--card);border-radius:26px;padding:20px;margin-bottom:14px;box-shadow:0 4px 20px rgba(11,77,184,.07);border:1px solid #EDF1F8}
.card h3{margin:0;font-size:18px;font-weight:600;display:flex;align-items:center;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mu{color:var(--mu)} .sm{font-size:13px} .xs{font-size:11px}
.big{font-size:44px;font-weight:300;letter-spacing:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:999px;background:linear-gradient(135deg,#2A6BDA,#0B4DB8);color:#fff;font-weight:600;font-size:17px;box-shadow:0 6px 16px rgba(11,77,184,.25);letter-spacing:.2px}
.btn.sec{background:#EEF3FC;color:var(--p);box-shadow:none}
.btn.out{background:#fff;color:var(--p);border:1.5px solid var(--p2);box-shadow:none}
.btn:disabled{opacity:.45}
.link{color:var(--p);font-weight:600}
.plus{width:46px;height:46px;border-radius:50%;background:#EEF3FC;color:var(--p);display:flex;align-items:center;justify-content:center;flex:none}
.pbar{height:10px;background:#EDF1F7;border-radius:9px;overflow:hidden}
.pbar>i{display:block;height:100%;background:linear-gradient(90deg,var(--p2),var(--p));border-radius:9px}
.chip{display:inline-flex;align-items:center;gap:8px;padding:12px 16px;border-radius:999px;background:#EEF3FC;margin:0 8px 8px 0;font-size:15px;color:var(--tx)}
.chip.on{background:var(--p);color:#fff}
.seg{display:flex;gap:8px}
.seg button{flex:1;padding:14px 6px;border-radius:18px;border:1.5px solid var(--li);background:#fff;font-weight:500}
.seg button.on{border-color:var(--p2);background:var(--pl);color:var(--p);font-weight:600}
.list .it{display:flex;align-items:center;gap:14px;padding:16px;background:#fff;border-radius:18px;margin-bottom:10px}
.list .it .t{flex:1}
.in{width:100%;padding:15px 16px;border-radius:18px;border:1.5px solid var(--li);background:#fff;outline:none}
.in:focus{border-color:var(--p2)}
label.l{display:block;font-size:14px;color:var(--mu);margin:14px 0 6px;font-weight:500}
.hr{height:1px;background:var(--li);margin:14px 0}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;width:calc(100% - 24px);max-width:496px;background:rgba(255,255,255,.96);border-radius:30px;box-shadow:0 6px 26px rgba(11,77,184,.16);display:flex;padding:6px;z-index:20}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0;border-radius:24px;font-size:12px;color:var(--mu);font-weight:500}
.nav button.on{background:var(--pl);color:var(--p);font-weight:600}
.nav .av{width:26px;height:26px;border-radius:50%;background:var(--p);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;overflow:hidden}
.nav .av img{width:100%;height:100%;object-fit:cover}
.fab{position:fixed;right:max(16px,calc(50% - 244px));bottom:96px;width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#FF8A2B,#FE6201);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(254,98,1,.35);z-index:21}
.pill{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;padding:16px 26px;border-radius:999px;background:linear-gradient(135deg,#FF8A2B,#FE6201);color:#fff;font-weight:600;display:flex;gap:8px;align-items:center;box-shadow:0 8px 20px rgba(11,77,184,.3);z-index:21;white-space:nowrap}
.ov{position:fixed;inset:0;background:rgba(74,59,68,.3);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fi .15s}
.sheet{width:100%;max-width:520px;background:#fff;border-radius:30px 30px 0 0;padding:20px 18px 28px;max-height:88vh;overflow:auto;animation:su .2s}
.sheet.dark{background:#fff;color:var(--tx);border-radius:30px;margin:0 10px 100px;box-shadow:0 10px 40px rgba(11,77,184,.2)}
.sheet.dark .mi{display:flex;gap:16px;align-items:center;padding:12px 4px;border-bottom:1px solid #EDF1F7}
.sheet.dark .mi:last-child{border:0}
.sheet.dark .mi .ic{width:58px;height:58px;border-radius:50%;background:var(--pl);display:flex;align-items:center;justify-content:center;flex:none}
.sheet.dark .mi b{display:block;font-size:18px;font-weight:600} .sheet.dark .mi span{color:var(--mu);font-size:14px}
@keyframes su{from{transform:translateY(40px);opacity:0}} @keyframes fi{from{opacity:0}}
.toast{white-space:nowrap;position:fixed;left:50%;bottom:170px;transform:translateX(-50%);background:#fff;color:var(--p);box-shadow:0 6px 20px rgba(11,77,184,.25);font-weight:500;padding:12px 22px;border-radius:999px;z-index:99;font-size:15px;animation:fi .2s}
.week{display:flex;justify-content:space-between;margin-bottom:14px}
.week button{flex:1;padding:8px 0;border-radius:16px;color:var(--mu);font-size:17px;display:flex;flex-direction:column;gap:6px;align-items:center}
.week button.on{background:var(--p);color:#fff;font-weight:600}
.week button.has b::after{content:"";display:block;width:5px;height:5px;border-radius:50%;background:var(--ac);margin:3px auto 0}
.macros{display:flex;gap:12px;margin-top:6px}
.macros>div{flex:1;text-align:center}
.macros b{font-size:14px}.macros .mu{font-size:13px}.macros .pbar{height:8px;margin:8px 0}
.glasses{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-top:16px}
.glass{height:52px;border-radius:6px 6px 10px 10px;background:#E6EFFD;display:flex;align-items:center;justify-content:center;clip-path:polygon(0 0,100% 0,90% 100%,10% 100%)}
.glass.f{background:linear-gradient(180deg,#B9CBF0,var(--blue))}
.meal{display:flex;align-items:center;gap:16px;padding:18px;background:#fff;border-radius:26px;margin-bottom:12px;box-shadow:0 4px 20px rgba(11,77,184,.06)}
.meal .em{font-size:38px;width:52px;text-align:center}
.meal .t{flex:1} .meal .t b{font-size:18px;font-weight:600}
.fooditem{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid #EDF1F7;font-size:14px}
.slider{width:100%;-webkit-appearance:none;appearance:none;height:8px;border-radius:8px;background:linear-gradient(90deg,#EAF1FD,#FFC59E);outline:none;margin:18px 0 6px}
.slider::-webkit-slider-thumb{-webkit-appearance:none;width:56px;height:36px;border-radius:20px;background:#fff;box-shadow:0 2px 10px rgba(11,77,184,.3);border:2px solid #CFE0FA}
.ruler{overflow-x:scroll;white-space:nowrap;scrollbar-width:none;position:relative;height:120px}
.ruler::-webkit-scrollbar{display:none}
.rwrap{position:relative}
.rwrap .needle{position:absolute;left:50%;top:44px;width:3px;height:76px;background:var(--p);border-radius:3px;transform:translateX(-50%);pointer-events:none}
.chatwrap{display:flex;flex-direction:column;min-height:calc(100vh - 80px)}
.msgs{flex:1;padding-bottom:110px}
.msg{max-width:84%;padding:12px 16px;border-radius:20px;margin:8px 0;line-height:1.4;white-space:pre-wrap}
.msg.me{background:linear-gradient(135deg,#2A6BDA,#0B4DB8);color:#fff;margin-left:auto;border-bottom-right-radius:6px}
.msg.bot{background:#fff;border-bottom-left-radius:6px;box-shadow:0 3px 14px rgba(11,77,184,.08)}
.composer{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;padding:10px 16px 18px;background:var(--bg)}
.composer .cbox{display:flex;gap:8px;background:#fff;border-radius:999px;padding:6px 6px 6px 18px;border:1.5px solid var(--li)}
.composer input{flex:1;border:0;outline:none;background:none;font-size:17px}
.send{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#2A6BDA,#0B4DB8);color:#fff;display:flex;align-items:center;justify-content:center}

.logo{width:88px;height:88px;border-radius:30px;background:linear-gradient(140deg,#FF8A2B,#FE6201);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:500;font-size:52px;font-family:var(--serif);margin:0 auto;box-shadow:0 10px 26px rgba(11,77,184,.3)}
.post{background:#fff;border-radius:24px;padding:18px;margin-bottom:12px;box-shadow:0 4px 20px rgba(11,77,184,.06)}
.post .h{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.avs{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600}
.empty{text-align:center;padding:30px 10px;color:var(--mu)}
.tabs{display:flex;border-bottom:1px solid var(--li);margin:12px 0}
.tabs button{flex:1;padding:12px;font-weight:500;color:var(--mu);border-bottom:3px solid transparent}
.tabs button.on{color:var(--p);border-color:var(--p)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{background:#fff;border-radius:24px;padding:18px 14px;text-align:left;display:flex;flex-direction:column;gap:18px;font-weight:600;font-size:16px;color:var(--tx);box-shadow:0 4px 20px rgba(11,77,184,.07)}
.tile svg{color:var(--p)}
.opt{display:flex;align-items:center;justify-content:space-between;padding:20px;background:#fff;border-radius:24px;border:1.5px solid var(--li);margin-bottom:12px;width:100%;text-align:left}
.opt.on{border-color:var(--p);background:var(--pl)}
.box{width:26px;height:26px;border-radius:8px;border:2px solid var(--li);display:flex;align-items:center;justify-content:center;flex:none}
.opt.on .box{background:var(--p);border-color:var(--p);color:#fff}
.steps{height:6px;background:#EDF1F7;border-radius:8px;flex:1;overflow:hidden}
.steps i{display:block;height:100%;background:linear-gradient(90deg,var(--p2),var(--p))}
.recipe{background:#fff;border-radius:24px;box-shadow:0 4px 20px rgba(11,77,184,.06);padding:16px;margin-bottom:12px;display:flex;gap:14px;align-items:center}
.recipe .em{font-size:40px;width:64px;height:64px;border-radius:16px;background:#F1F5FC;display:flex;align-items:center;justify-content:center}
.ph{display:flex;gap:14px;justify-content:center;align-items:center}
.ph .im{width:120px;height:150px;border-radius:22px;background:#F1F5FC;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--mu);font-size:13px;text-align:center}
.ph .im img{width:100%;height:100%;object-fit:cover}
.bmi{height:12px;border-radius:8px;background:linear-gradient(90deg,#AFC3EE 0 10%,#A8D3B8 10% 37%,#F2CF96 37% 58%,#E9A6B3 58%);position:relative;margin:18px 0 8px}
.bmi i{position:absolute;top:-6px;width:6px;height:24px;background:#fff;border:2px solid var(--p);border-radius:2px}
.tag{display:inline-block;padding:6px 14px;border-radius:999px;font-weight:600;font-size:14px}
.rd{width:26px;height:26px;border-radius:50%;border:2px solid #D5DDEA;flex:none}
.opt.on .rd{border-color:var(--p);background:var(--p);box-shadow:inset 0 0 0 5px #fff}
.opt b{font-weight:600}
.obf{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:520px;padding:16px 16px 24px;background:linear-gradient(rgba(252,248,248,0),var(--bg) 35%);z-index:15}
.wbox{position:relative;background:#fff;border-radius:28px;padding:20px 10px;display:flex;gap:4px;box-shadow:0 4px 20px rgba(11,77,184,.07)}
.wbox .band{position:absolute;left:12px;right:12px;top:108px;height:44px;border-radius:16px;background:var(--pl)}
.wheel{position:relative;height:220px;overflow-y:scroll;scroll-snap-type:y mandatory;flex:1;scrollbar-width:none;-webkit-mask-image:linear-gradient(transparent,#000 38%,#000 62%,transparent);mask-image:linear-gradient(transparent,#000 38%,#000 62%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wi{height:44px;line-height:44px;text-align:center;scroll-snap-align:center;font-size:20px;white-space:nowrap}
.bignum{text-align:center;margin:26px 0 4px}.bignum b{font-size:76px;font-weight:300;color:var(--tx)}.bignum span{font-size:24px;color:var(--mu)}
.gtile{background:#fff;border:1.5px solid var(--li);border-radius:24px;padding:16px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;position:relative;font-weight:500;min-height:118px}
.gtile.on{border-color:var(--p2);background:var(--pl);color:var(--p)}
.gtile .em{font-size:36px}.gtile .ck{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--p);display:flex;align-items:center;justify-content:center}
.feat{display:flex;gap:16px;align-items:center;background:#fff;border-radius:24px;padding:18px;margin-bottom:12px;box-shadow:0 4px 20px rgba(11,77,184,.06)}
.feat .ci{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.mt{display:flex;gap:14px;align-items:center;background:#F6F8FC;border-radius:20px;padding:14px}
.mt .ci{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.mt b{font-size:22px;font-weight:500}
.disc{font-size:12px;color:var(--mu);text-align:center;margin-top:8px}
</style>
</head>

}
function calcKcal(p){
  const age=p.age||35,h=p.height||165,w=p.curW||p.startWeight||80;

  const f=(ACTLV.find(a=>a[0]===p.act)||ACTLV[0])[3];const def=Math.min(1000,(p.pace||0.5)*1100);
  return Math.max(p.sex==='M'?1500:1200,Math.round((bmr*f-def)/50)*50);
}
function streak(){
  const days=new Set();
  [S.weights,S.doses,S.meals,S.acts,S.symptoms,S.bowel].forEach(a=>a.forEach(x=>days.add(dk(x.d))));
  Object.keys(S.water).forEach(k=>{if(S.water[k]>0)days.add(k)});
  let n=0,d=new Date();
  if(!days.has(dk(d)))d=addDays(d,-1);
  while(days.has(dk(d))){n++;d=addDays(d,-1)}
  return n;
}

function defMealType(){const h=new Date().getHours();return h<10?'cafe':h<15?'almoco':h<18?'lanche':'jantar'}
const norm=t=>t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z ]/g,' ').split(/\s+/).filter(w=>w.length>1&&!['de','do','da','com','sem','um','uma'].includes(w)).map(w=>w.replace(/(oes|aes)$/,'ao').replace(/s$/,''));
function findFood(name){const q=norm(name);if(!q.length)return null;let best=null,bs=0;FOODS.forEach(f=>{const fw=norm(f[0]);let sc=0;q.forEach(w=>{if(fw.includes(w))sc+=2;else if(fw.some(x=>x.startsWith(w)||w.startsWith(x)&&x.length>3))sc+=1});sc-=0.1*Math.abs(fw.length-q.length);if(fw[0]===q[0])sc+=0.5;if(sc>bs){bs=sc;best=f}});return bs>=1.5?best:null}
function parseDescription(txt){
  const parts=txt.toLowerCase().split(/,| e |\+|\n|;/).map(s=>s.trim()).filter(Boolean);
  const out=[];
  parts.forEach(p=>{
    let q=1;const m=p.match(/^(\d+[.,]?\d*)\s*(x|un|unidades?|fatias?|col\w*|conchas?|copos?|porç\w*)?\s*(de\s+)?(.*)$/);
    let name=p;if(m){q=num(m[1])||1;name=m[4]||p}
    name=name.replace(/^(um|uma|dois|duas|tr[eê]s)\s+/,(a)=>{if(/dois|duas/.test(a))q=2;if(/tr/.test(a))q=3;return ''});
    const f=findFood(name);
    if(f){const pm=f[1].match(/^(\d+) (unidades|ovos)/);if(pm&&m&&m[1])q=q/num(pm[1]);out.push(foodObj(f,q))}
  });
  return out;
}
function foodObj(f,q=1){return {name:f[0],portion:(q!==1?nf(q)+' × ':'')+f[1],kcal:Math.round(f[2]*q),p:+(f[3]*q).toFixed(1),c:+(f[4]*q).toFixed(1),f:+(f[5]*q).toFixed(1),fib:+(f[6]*q).toFixed(1)}}

function go(v,p={}){Hist.pushState({v,p,tab},'');view=v;params=p;render();window.scrollTo(0,0)}
function setTab(t){tab=t;view=null;params={};Hist.replaceState({v:null,p:{},tab},'');render();window.scrollTo(0,0)}
function back(){Hist.back()}
function onPop(s){if(overlay){closeOv(true)}s=s||{};view=s.v||null;params=s.p||{};tab=s.tab||tab;render()}
window.addEventListener('popstate',e=>{if(NATIVE)onPop(e.state)});
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function openOv(html,cls='',onClick){
  closeOv(true);
  const o=document.createElement('div');o.className='ov';o.innerHTML=`<div class="sheet ${cls}">${html}</div>`;
  o.addEventListener('click',e=>{if(e.target===o)back()});
  document.body.appendChild(o);overlay=o;Hist.pushState({v:view,p:params,tab,ov:1},'');
}
function closeOv(silent){if(overlay){overlay.remove();overlay=null}}
function closeOvBack(){if(overlay)back()}
function header(title,right=''){return `<div class="bar"><button class="round" onclick="back()">${ic('back')}</button><h2 ${right?'style="margin:0"':''}>${title}</h2>${right}</div>`}

/* ============ Render ============ */
function render(){
  if(BOOT==='loading'){app.innerHTML=`<div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px"><img src="${LOGO}" style="width:180px"><div class="mu">Carregando…</div></div>`;return}
  if(BOOT==='login'){app.innerHTML=loginScreen();return}
  if(BOOT==='pick'){app.innerHTML=pickScreen();return}
  if(!S.profile){app.innerHTML=onboarding();afterRender();return}
  if(view&&V[view]){app.innerHTML=V[view](params);afterRender();return}
  const T={inicio:homeTab,nutricao:nutriTab,comunidade:commTab,doses:dosesTab,perfil:profileTab};
  app.innerHTML=T[tab]()+navBar();afterRender();
}
let afterHooks=[];
function afterRender(){const h=afterHooks;afterHooks=[];h.forEach(f=>f())}
function navBar(){
  const p=S.profile;
  const av=p.photo?`<span class="av"><img src="${p.photo}"></span>`:`<span class="av">${esc((p.name||'?')[0].toUpperCase())}</span>`;
  const b=(t,i,l)=>`<button class="${tab===t?'on':''}" onclick="setTab('${t}')">${i}<span>${l}</span></button>`;
  return `<nav class="nav">${b('inicio',ic('home'),'Início')}${b('nutricao',ic('fork'),'Nutrição')}${b('comunidade',ic('users'),'Comunidade')}${b('doses',ic('pen'),'Doses')}${b('perfil',av,'Perfil')}</nav>`+
   (tab==='nutricao'?`<button class="pill" onclick="go('addMeal',{type:defMealType(),date:nutDate})">${ic('plus')} Registrar refeição</button>`:`<button class="fab" onclick="fabMenu()">${ic('plus',30,'#fff',2)}</button>`);
}
function topBar(t){return `<div class="top"><h1>${t}</h1><div class="r"><span class="streak">${ic('flame',24,'#FE6201')}${streak()}</span><button onclick="go('settings')">${ic('gear',28)}</button></div></div>`}
function fabMenu(){
  const g=goals();const kc=S.acts.filter(a=>dk(a.d)===dk()).reduce((s,a)=>s+a.kcal,0);
  const mi=(fn,i,c,t,s)=>`<button class="mi" style="width:100%;text-align:left" onclick="${fn}"><span class="ic">${ic(i,30,c)}</span><span><b>${t}</b><span>${s}</span></span></button>`;
  openOv(mi("ovGo('dose')",'pen','#8BBF9F','Registrar Aplicação','Dose, local da injeção e sensação')+
   mi("ovGo('addMeal',{type:defMealType(),date:dk()})",'fork','#FE6201','Registrar Refeição','Meta: '+nf(g.kcal,0)+' kcal')+
   mi("ovGo('activity')",'run','#9DB4E6','Registrar Atividade',nf(kc,0)+' kcal queimadas')+
   mi("ovGo('weight')",'scale','#B9A7DA','Registrar Peso',nf1(curWeight())+' kg')+
   mi("ovGo('symptom')",'heart','#F0B08F','Registrar Sintoma','Como você se sente hoje')+
   mi("ovGo('chat')",'spark','#0B4DB8','Chat com a Mia','Dúvidas, receitas e dicas da sua jornada'),'dark');
}
function ovGo(v,p){closeOv();Hist.replaceState({v,p:p||{},tab},'');view=v;params=p||{};render();window.scrollTo(0,0)}

  const em=loginMode;

  <h1 style="font-size:28px;margin:0 0 6px">${em==='signup'?'Crie sua conta':'Bem-vinda ao MonMe'}</h1><p class="mu" style="font-size:16px;margin:0 0 28px">Entre para salvar seus dados com segurança e acessar de qualquer aparelho.</p>
  ${em?`<div style="text-align:left">${em==='signup'?`<label class="l">Nome</label><input class="in" id="lgn" autocomplete="given-name" placeholder="Seu nome">`:''}<label class="l">E-mail</label><input class="in" id="lge" type="email" autocomplete="email" inputmode="email" placeholder="voce@email.com"><label class="l">Senha</label><input class="in" id="lgs" type="password" autocomplete="${em==='signup'?'new-password':'current-password'}" placeholder="Mínimo 6 caracteres">

   <div class="between" style="margin-top:16px"><button class="link" onclick="loginMode='${em==='signup'?'login':'signup'}';render()">${em==='signup'?'Já tenho conta':'Criar conta'}</button>${em==='login'?`<button class="mu" onclick="doReset()">Esqueci a senha</button>`:''}</div>
   ${only?'':`<button class="mu" style="display:block;margin:22px auto 0" onclick="loginMode='';render()">‹ Outras formas de entrar</button>`}</div>`:
  `${LOGIN.apple?`<button class="btn" style="background:#000;box-shadow:none" onclick="doSocial('apple')" ${busy?'disabled':''}>${ALOGO} Continuar com Apple</button>`:''}
   ${LOGIN.google?`<button class="btn" style="background:#fff;color:#1F2A44;border:1.5px solid var(--li);box-shadow:none;margin-top:12px" onclick="doSocial('google')" ${busy?'disabled':''}>${GLOGO} Continuar com Google</button>`:''}
   ${LOGIN.email?`<div class="row" style="margin:22px 0;gap:12px"><span style="flex:1;height:1px;background:var(--li)"></span><span class="mu sm">ou</span><span style="flex:1;height:1px;background:var(--li)"></span></div><button class="btn sec" onclick="loginMode='login';render()">${ic('user',20)} Entrar com e-mail</button>`:''}`}
  <p class="disc" style="margin-top:30px">Ao continuar você concorda em guardar seus registros na sua conta MonMe. O app não substitui acompanhamento médico.</p></div>`;
}
async function doSocial(k){busy=true;render();try{await FBX[k]()}catch(e){toast(e.message)}busy=false;if(BOOT==='login')render()}
async function doEmail(){const e=(document.getElementById('lge').value||'').trim(),s=document.getElementById('lgs').value||'';const n=document.getElementById('lgn');
  if(!e||!s)return toast('Preencha e-mail e senha');if(n&&!n.value.trim())return toast('Digite seu nome');
  if(n)ob.name=n.value.trim();busy=true;render();
  try{loginMode==='signup'?await FBX.emailSignup(e,s,n.value.trim()):await FBX.emailLogin(e,s)}catch(err){toast(err.message)}busy=false;if(BOOT==='login'){render();const x=document.getElementById('lge');if(x)x.value=e}}
function doReset(){const e=(document.getElementById('lge').value||'').trim();if(!e)return toast('Digite seu e-mail primeiro');FBX.resetPassword(e).then(()=>toast('Enviamos um link para seu e-mail'),err=>toast(err.message))}
function logout(){ask('Sair da sua conta neste aparelho?',()=>{clearTimeout(saveT);if(USER)pushCloud();setTimeout(()=>FBX.logout(),300)},'Sair')}
function deleteAccount(){ask('Excluir sua conta e TODOS os seus dados? Isso não pode ser desfeito.',async()=>{try{clearTimeout(saveT);const u=USER.uid;await FBX.deleteAll(u);try{localStorage.removeItem(KEY+'_'+u)}catch(e){}await FBX.deleteAccount();toast('Conta excluída')}catch(e){toast(e.message)}},'Excluir')}
const PCOL=['#0B4DB8','#FE6201','#2FA36B','#F0A800','#2A6BDA','#E5484D'];
function pickScreen(){
  return `<div class="scr" style="padding-top:5vh;text-align:center"><img src="${LOGO}" alt="MonMe" style="width:170px;display:block;margin:0 auto"><h1 style="font-size:28px;margin:18px 0 6px">Quem está usando?</h1><p class="mu" style="margin:0 0 24px">Cada pessoa tem seu próprio perfil. Os dados ficam salvos neste aparelho.</p>
  <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:12px">${PROFILES.map((p,i)=>`<button class="gtile" style="min-height:150px" onclick="pickProfile('${p.id}')">${p.photo?`<img src="${p.photo}" style="width:68px;height:68px;border-radius:50%;object-fit:cover">`:`<span class="avs" style="width:68px;height:68px;font-size:28px;background:${PCOL[i%PCOL.length]}">${esc((p.name||'?')[0].toUpperCase())}</span>`}<b style="font-size:17px">${esc(p.name||'Sem nome')}</b>${p.pin?'<span class="mu xs">🔒 protegido por PIN</span>':''}</button>`).join('')}
  <button class="gtile" style="min-height:150px;border-style:dashed" onclick="newProfile()"><span class="avs" style="width:68px;height:68px;font-size:36px;background:var(--pl);color:var(--p)">+</span><b style="font-size:17px">Novo perfil</b></button></div></div>`;
}
function pickProfile(id){const p=PROFILES.find(x=>x.id===id);if(!p)return;if(p.pin)askText('Digite o PIN de '+(p.name||'perfil'),'',v=>{if(String(v).trim()===p.pin)enterProfile(id);else toast('PIN incorreto')});else enterProfile(id)}
async function enterProfile(id){CURP=id;BOOT='loading';render();let d=await IDB.get('data_'+id);try{d=typeof d==='string'?JSON.parse(d):d}catch(e){d=null}
  S=Object.assign({},DEF,d||{});BOOT='ready';tab='inicio';view=null;Hist.replaceState({v:null,p:{},tab});try{localStorage.setItem('monme_last',id)}catch(e){}render();window.scrollTo(0,0)}
function newProfile(){CURP=uid();S=Object.assign({},DEF);ob=JSON.parse(OB0);BOOT='ready';view=null;tab='inicio';render();window.scrollTo(0,0)}
function switchProfile(){flushLocal();CURP=null;S=Object.assign({},DEF);view=null;BOOT='pick';Hist.replaceState({v:null,p:{},tab});render();window.scrollTo(0,0)}
function setPin(){const e=PROFILES.find(x=>x.id===CURP);if(!e)return;
  if(e.pin)return ask('Remover o PIN deste perfil?',()=>{e.pin='';IDB.set('profiles',PROFILES);toast('PIN removido');render()},'Remover');
  askText('Crie um PIN de 4 dígitos','',v=>{v=String(v).replace(/\D/g,'');if(v.length!==4)return toast('O PIN precisa ter 4 números');e.pin=v;IDB.set('profiles',PROFILES);toast('PIN criado 🔒');render()})}
function deleteProfile(){ask('Apagar este perfil e TODOS os dados dele neste aparelho?',async()=>{const id=CURP;clearTimeout(lsT);CURP=null;await IDB.del('data_'+id);PROFILES=PROFILES.filter(x=>x.id!==id);await IDB.set('profiles',PROFILES);toast('Perfil apagado');
  if(PROFILES.length){S=Object.assign({},DEF);BOOT='pick';render()}else newProfile()},'Apagar')}
async function bootLocal(){
  render();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  PROFILES=(await IDB.get('profiles'))||[];
  if(!PROFILES.length){try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&old.profile){const id=uid();PROFILES=[{id,name:old.profile.name,photo:old.profile.photo||'',pin:''}];await IDB.set('data_'+id,JSON.stringify(old));await IDB.set('profiles',PROFILES);localStorage.removeItem(KEY)}}catch(e){}}
  if(!PROFILES.length)return newProfile();
  if(PROFILES.length===1&&!PROFILES[0].pin)return enterProfile(PROFILES[0].id);
  BOOT='pick';render();
}
function boot(){
  Hist.replaceState({v:null,p:{},tab});
  if(!CLOUD){bootLocal();return}
  try{FBX.init(FC)}catch(e){console.log(e);BOOT='ready';render();return}
  render();
  FBX.onUser(async u=>{
    if(unsubPosts){unsubPosts();unsubPosts=null}cloudPosts=null;USER=u;
    if(!u){BOOT='login';loginMode='';busy=false;S=Object.assign({},DEF);ob.step=0;view=null;tab='inicio';render();return}
    BOOT='loading';render();
    let st=null;try{st=await FBX.loadState(u.uid)}catch(e){try{st=JSON.parse(localStorage.getItem(KEY+'_'+u.uid)||'null')}catch(_){}}
    let migrated=false;
    if(!st){try{const old=JSON.parse(localStorage.getItem(KEY)||'null');if(old&&old.profile){st=old;migrated=true}}catch(e){}}
    S=Object.assign({},DEF,st||{});
    if(!S.profile&&!ob.name&&u.displayName)ob.name=u.displayName.split(' ')[0];
    if(migrated){save();(S.photos||[]).forEach(ph=>FBX.addPhoto(u.uid,ph).catch(()=>{}));try{localStorage.removeItem(KEY)}catch(e){}}
    BOOT='ready';tab='inicio';view=null;Hist.replaceState({v:null,p:{},tab});render();window.scrollTo(0,0);
    unsubPosts=FBX.listenPosts(ps=>{cloudPosts=ps||[];if(tab==='comunidade'&&!view&&BOOT==='ready'&&!(document.activeElement&&document.activeElement.id==='pt'))render()});
  });
}

const OB0=JSON.stringify(ob);

function obSet(k,v){ob[k]=v;render()}
function radio(k,v,label,sub,icon){const on=ob[k]===v;return `<button class="opt ${on?'on':''}" onclick="obSet('${k}',${q(v)})"><span class="row" style="gap:14px;text-align:left">${icon?ic(icon,24,on?'var(--p)':'#8A94A8'):''}<span><b style="font-size:17px">${label}</b>${sub?`<br><span class="mu">${sub}</span>`:''}</span></span><span class="rd"></span></button>`}
const T=(t,sub)=>`<h1 style="margin:0 0 8px;font-size:34px">${t}</h1>${sub?`<p class="mu" style="font-size:17px;margin:0 0 22px;line-height:1.4">${sub}</p>`:'<div style="height:18px"></div>'}`;
function dateOf(o){return new Date(o.y,o.m-1,Math.min(o.d,new Date(o.y,o.m,0).getDate()),12)}
function obAge(){const b=ob.birth,t=new Date();let a=t.getFullYear()-b.y;if(t.getMonth()+1<b.m||(t.getMonth()+1===b.m&&t.getDate()<b.d))a--;return a}
function bmiOf(w,h){return w/Math.pow(h/100,2)}
function bmiCat(b){return b<18.5?['Abaixo do peso','#2A6BDA']:b<25?['Saudável','#2FA36B']:b<30?['Sobrepeso','#D98200']:['Obesidade','#FE6201']}
/* roda de datas */
function wheel(id,items){return `<div class="wheel" id="${id}"><div style="height:88px"></div>${items.map(t=>`<div class="wi">${t}</div>`).join('')}<div style="height:88px"></div></div>`}
function mountWheel(id,idx,cb){afterHooks.push(()=>{const w=document.getElementById(id);if(!w)return;w.scrollTop=idx*44;let t;w.onscroll=()=>{clearTimeout(t);t=setTimeout(()=>cb(Math.max(0,Math.round(w.scrollTop/44))),80)}})}
function dateWheels(key,y0,y1){const o=ob[key];const ys=[];for(let y=y1;y>=y0;y--)ys.push(y);
  mountWheel('wd',o.d-1,i=>o.d=i+1);mountWheel('wm',o.m-1,i=>o.m=i+1);mountWheel('wy',Math.max(0,ys.indexOf(o.y)),i=>o.y=ys[Math.min(i,ys.length-1)]);
  return `<div class="wbox" style="margin-top:8vh"><div class="band"></div>${wheel('wd',Array.from({length:31},(_,i)=>i+1)).replace('class="wheel"','class="wheel" style="flex:.6"')}${wheel('wm',MESF)}${wheel('wy',ys).replace('class="wheel"','class="wheel" style="flex:.8"')}</div><p class="mu" style="text-align:center;margin-top:14px">Você pode alterar isso depois</p>`}
/* régua */
function rulerHTML(id,min,max,step,every){let t='';const n=Math.round((max-min)/step);for(let i=0;i<=n;i++){const v=min+i*step;const mj=i%every===0,hf=i%(every/2)===0;t+=`<span style="display:inline-block;width:10px;position:relative;height:100%">${mj?`<span style="position:absolute;top:0;left:50%;transform:translateX(-50%);color:#9AA6B8;font-size:16px">${Math.round(v)}</span>`:''}<i style="position:absolute;bottom:0;left:4px;width:2px;height:${mj?50:hf?38:28}px;background:#D3DCEA;border-radius:2px"></i></span>`}
  return `<div class="rwrap" style="margin-top:20px"><div class="ruler" id="${id}"><span style="display:inline-block;width:calc(50% - 5px)"></span>${t}<span style="display:inline-block;width:calc(50% - 5px)"></span></div><div class="needle"></div></div>`}
function mountRuler(id,min,step,val,cb){afterHooks.push(()=>{const r=document.getElementById(id);if(!r)return;r.scrollLeft=Math.round((val-min)/step)*10;r.onscroll=()=>cb(+(min+Math.round(r.scrollLeft/10)*step).toFixed(1))})}
function bigNum(v,u,dec){return `<button class="bignum" style="display:block;width:100%" onclick="obType()"><b id="bv">${dec?nf1(v):Math.round(v)}</b><span> ${u}</span></button><p class="mu" style="text-align:center;margin:0">Toque no número para digitar · deslize a régua</p>`}
let obTypeCb=null;function obType(){if(obTypeCb)askText('Digite o valor','',v=>{const n=num(v);if(n)obTypeCb(n)})}

function projSvg(w0,w1,weeks){const pts=[];for(let i=0;i<=20;i++){const x=i/20;pts.push([20+x*280,30+(1-Math.pow(1-x,1.4))*90])}

function gauge(val,max,size=200){
  const pct=Math.min(1,val/max);const r=80,cx=100,cy=100;const a0=Math.PI*0.75,a1=Math.PI*2.25;const L=r*(a1-a0);
  const pt=a=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];const [x0,y0]=pt(a0),[x1,y1]=pt(a1);const ae=a0+(a1-a0)*pct;const [xe,ye]=pt(ae);
  const path=`M${x0} ${y0} A${r} ${r} 0 1 1 ${x1} ${y1}`;
  return `<svg width="${size}" height="${size*0.85}" viewBox="0 0 200 170" style="display:block;margin:0 auto"><defs><linearGradient id="gg" x1="0" x2="1"><stop offset="0" stop-color="#FFC20E"/><stop offset="1" stop-color="#FE6201"/></linearGradient></defs><path d="${path}" stroke="#EEF3FC" stroke-width="14" fill="none" stroke-linecap="round"/><path d="${path}" stroke="${val>max?'var(--bad)':'url(#gg)'}" stroke-width="14" fill="none" stroke-linecap="round" stroke-dasharray="${L*pct} ${L}"/><circle cx="${xe}" cy="${ye}" r="9" fill="#0B4DB8" stroke="#fff" stroke-width="3"/><text x="100" y="98" text-anchor="middle" font-size="42" font-weight="300" fill="#4A3B44">${nf(val,0)}</text><text x="100" y="125" text-anchor="middle" font-size="16" fill="#8A94A8">de ${nf(max,0)} kcal</text></svg>`;
}

}

V.symptom=()=>{
  if(!params.v)params.v={nausea:0,head:0,appetite:0,custom:{}};const cs=S.profile.customSymptoms||[];
  const sl=(lbl,val,on)=>`<div style="margin-bottom:18px"><div class="between"><b style="font-size:19px">${lbl}</b><b style="font-size:19px"><span>${val}</span>/10</b></div><input type="range" class="slider" min="0" max="10" value="${val}" oninput="${on};this.previousElementSibling.querySelector('span').textContent=this.value"></div>`;
  return `<div class="scr">${header('Registro de Sintomas')}<div class="card" style="padding:16px 18px"><div class="between"><span class="row">${ic('cal',26,'var(--p)')} <b style="font-size:19px">Data</b></span><span class="mu">${when(new Date())}</span></div></div>
  <div class="card">${BASE_SYM.map(([k,n])=>sl(n,params.v[k],`params.v.${k}=+this.value`)).join('')}${cs.map((n,i)=>sl(esc(n),params.v.custom[n]||0,`params.v.custom[S.profile.customSymptoms[${i}]]=+this.value`)).join('')}
  <div class="hr"></div><p class="mu" style="text-align:center;font-size:17px">Há outros sintomas que você quer acompanhar?</p><button class="btn sec" style="width:auto;margin:0 auto;padding:14px 28px" onclick="customSym()">Personalizar sintomas</button></div>
  <b style="font-size:19px;display:block;margin:6px 4px 10px">Observações</b><textarea class="in" rows="4" placeholder="Ex.: senti enjoo depois do almoço, que foi mais gorduroso" oninput="params.v.note=this.value" style="resize:none;border:0;border-radius:22px">${esc(params.v.note||'')}</textarea>
  ${symAlert(params.v)}<button class="btn" style="margin-top:20px" onclick="saveSym()">Registrar sintomas</button></div>`;
};
function symAlert(v){return (v.nausea>=8)?`<div class="card" style="background:#FFF4E5;margin-top:14px;font-size:15px">⚠️ Náusea forte e persistente, vômitos frequentes, dor abdominal intensa ou sinais de desidratação: procure seu médico ou um pronto-atendimento.</div>`:''}
function customSym(){
  const cs=S.profile.customSymptoms=S.profile.customSymptoms||[];
  openOv(`<h3 style="margin:0 0 12px">Personalizar sintomas</h3><div>${EXTRA_SYM.map(n=>`<button class="chip ${cs.includes(n)?'on':''}" onclick="const a=S.profile.customSymptoms;const i=a.indexOf('${n}');i<0?a.push('${n}'):a.splice(i,1);save();this.classList.toggle('on')">${n}</button>`).join('')}</div><button class="btn" style="margin-top:16px" onclick="closeOvBack();setTimeout(render,30)">Pronto</button>`);
}
function saveSym(){S.symptoms.push(Object.assign({id:uid(),d:new Date().toISOString()},JSON.parse(JSON.stringify(params.v))));save();toast('Sintomas registrados ✓');back()}
const BOWEL=['Normal','Endurecido','Pastoso','Líquido','Com esforço'];
function bowelSheet(){openOv(`<h3 style="margin:0 0 12px">Como foi?</h3>${BOWEL.map(b=>`<button class="opt" onclick="S.bowel.push({id:uid(),d:new Date().toISOString(),type:'${b}'});save();closeOvBack();toast('Registrado ✓');setTimeout(render,30)"><b>${b}</b>${ic('chev',20,'#999')}</button>`).join('')}`)}
function bowelHint(){const l=S.bowel.slice().sort((a,b)=>b.d.localeCompare(a.d))[0];if(!l)return '';const d=Math.floor((Date.now()-new Date(l.d))/864e5);return d>=3?'Já faz '+d+' dias. Capriche na água e nas fibras; se persistir, fale com seu médico.':'Ritmo dentro do esperado.'}
V.calc=()=>{
  const p=S.profile;if(params.mg==null)params.mg=p.doseMg;if(params.conc==null)params.conc=p.conc||'';
  const mg=num(params.mg),c=num(params.conc);const ml=c?mg/c:0;const ui=ml*100;
  return `<div class="scr">${header('Calculadora de doses')}<div class="card"><label class="l" style="margin-top:0">Dose prescrita (mg)</label><input class="in" inputmode="decimal" value="${params.mg}" oninput="params.mg=this.value;calcUpd()">
  <label class="l">Concentração do frasco (mg/mL)</label><input class="in" inputmode="decimal" placeholder="Veja no rótulo. Ex.: 5" value="${params.conc}" oninput="params.conc=this.value;calcUpd()">
  <p class="mu sm">Se o rótulo traz, por exemplo, “10 mg em 2 mL”, a concentração é 10 ÷ 2 = 5 mg/mL.</p></div>
  <div class="card" style="text-align:center" id="cres">${calcRes(ml,ui)}</div>
  <p class="disc" style="font-size:13px">Cálculo para seringa de insulina U-100 (100 UI = 1 mL). Confira sempre com a prescrição e a bula; em caso de dúvida, pergunte ao farmacêutico ou médico antes de aplicar.</p>
  <button class="btn sec" style="margin-top:14px" onclick="S.profile.conc=params.conc;save();toast('Concentração salva')">Salvar concentração</button></div>`;
};
function calcRes(ml,ui){return ml?`<div class="mu">Puxe na seringa U-100</div><div class="big" style="font-size:64px;color:var(--p)">${nf(ui,1)} UI</div><div class="mu">= ${nf(ml,3)} mL</div><div style="margin-top:14px">${syringe(ui)}</div>`:'<div class="mu" style="padding:20px">Preencha a dose e a concentração</div>'}
function calcUpd(){const mg=num(params.mg),c=num(params.conc);const ml=c?mg/c:0;document.getElementById('cres').innerHTML=calcRes(ml,ml*100)}
function syringe(ui){const w=Math.min(100,ui);let t='';for(let i=0;i<=100;i+=5)t+=`<line x1="${20+i*2.6}" y1="20" x2="${20+i*2.6}" y2="${i%10?30:36}" stroke="#888"/>${i%20===0?`<text x="${20+i*2.6}" y="52" font-size="10" text-anchor="middle" fill="#666">${i}</text>`:''}`;
 return `<svg viewBox="0 0 330 60" width="100%"><rect x="20" y="8" width="260" height="30" rx="4" fill="#F3F6FB" stroke="#bbb"/><rect x="20" y="8" width="${w*2.6}" height="30" rx="4" fill="var(--p2)" opacity=".55"/>${t}<rect x="280" y="18" width="40" height="10" fill="#ccc"/></svg>`}
function levelChart(){
  const p=S.profile;const hl=medOf(p.med).hl;const ds=S.doses;
  if(!ds.length)return `<p class="mu" style="text-align:center;font-size:17px;line-height:1.5">Registre sua primeira dose pra acompanhar o nível estimado do medicamento no seu corpo</p><div style="display:flex;justify-content:center;gap:14px">${DOW.map(d=>`<div style="text-align:center"><div style="width:30px;height:10px;border-radius:6px;background:#F0EEF3"></div><div class="mu xs" style="margin-top:8px">${d}</div></div>`).join('')}</div>`;
  const now=Date.now();const t0=now-21*864e5,t1=now+7*864e5;const N=84;const pts=[];let mx=0;
  for(let i=0;i<=N;i++){const t=t0+(t1-t0)*i/N;let v=0;ds.forEach(d=>{const dt=(t-new Date(d.d))/864e5;if(dt>=0){const abs=Math.min(1,dt/1);v+=d.mg*abs*Math.pow(.5,dt/hl)}});pts.push([t,v]);mx=Math.max(mx,v)}
  mx=mx||1;const X=t=>10+(t-t0)/(t1-t0)*300,Y=v=>120-v/mx*100;
  const path=pts.map((q,i)=>(i?'L':'M')+X(q[0]).toFixed(1)+' '+Y(q[1]).toFixed(1)).join(' ');
  const cur=pts.reduce((a,b)=>Math.abs(b[0]-now)<Math.abs(a[0]-now)?b:a);
  return `<svg viewBox="0 0 320 140" width="100%"><path d="${path} L310 120 L10 120Z" fill="var(--pl)"/><path d="${path}" stroke="var(--p)" stroke-width="2.5" fill="none"/><line x1="${X(now)}" y1="10" x2="${X(now)}" y2="120" stroke="#999" stroke-dasharray="3 3"/><circle cx="${X(now)}" cy="${Y(cur[1])}" r="5" fill="var(--ac)"/><text x="${X(now)}" y="136" font-size="10" text-anchor="middle" fill="#666">hoje</text><text x="10" y="136" font-size="10" fill="#999">-3 sem</text><text x="310" y="136" font-size="10" text-anchor="end" fill="#999">+1 sem</text></svg><div class="mu sm" style="text-align:center">Estimativa: ~${nf(cur[1],2)} mg ativos agora (meia-vida aprox. ${hl>=1?nf(hl)+' dias':Math.round(hl*24)+' h'})</div>`;
}
function levelInfo(){openOv(`<h3 style="margin:0 0 10px">Nível do medicamento</h3><p style="line-height:1.5">É uma <b>estimativa</b> feita a partir das doses que você registrou e da meia-vida média do medicamento. Não é um exame e varia de pessoa para pessoa. Serve só para você visualizar o ritmo entre as aplicações.</p><button class="btn" onclick="closeOvBack()">Entendi</button>`)}
V.treatment=()=>{const p=S.profile;return `<div class="scr">${header('Tratamento')}<div class="card"><label class="l" style="margin-top:0">Medicamento</label><select class="in" onchange="S.profile.med=this.value;S.profile.freq=medOf(this.value).freq;save();render()">${MEDS[p.med]?'':`<option selected>${esc(p.med)}</option>`}${MED_GROUPS.map(([g,l])=>`<optgroup label="${g}">${l.map(m=>`<option ${m===p.med?'selected':''}>${m}</option>`).join('')}</optgroup>`).join('')}</select>

 <label class="l">Intervalo entre doses (dias)</label><input class="in" inputmode="numeric" value="${p.freq}" onchange="S.profile.freq=Math.max(1,parseInt(this.value)||7);save()">
 <label class="l">Concentração do frasco (mg/mL) — opcional</label><input class="in" inputmode="decimal" value="${esc(p.conc||'')}" onchange="S.profile.conc=this.value;save()"></div>
 <button class="btn" onclick="toast('Salvo ✓');back()">Salvar</button><p class="disc">Altere a dose somente conforme orientação do seu médico.</p></div>`};
V.settings=()=>{const p=S.profile;const g=goals();return `<div class="scr">${header('Configurações')}<div class="card"><label class="l" style="margin-top:0">Nome</label><input class="in" value="${esc(p.name)}" onchange="S.profile.name=this.value.trim()||S.profile.name;save()">

 <label class="l">Meta de peso (kg)</label><input class="in" inputmode="decimal" value="${nf1(p.goalWeight)}" onchange="S.profile.goalWeight=num(this.value)||S.profile.goalWeight;save()"></div>
 <div class="card"><h3>Metas diárias</h3><label class="l">Calorias (kcal)</label><input class="in" inputmode="numeric" value="${p.kcalGoal}" onchange="S.profile.kcalGoal=Math.max(800,parseInt(this.value)||1500);save()">
 <label class="l">Água (mL)</label><input class="in" inputmode="numeric" value="${g.water}" onchange="S.profile.waterGoal=Math.max(1000,Math.min(5000,parseInt(this.value)||2500));save()">
 <p class="mu sm">Proteína, carboidrato e gordura são calculados a partir da meta de calorias e do seu peso. Ajuste suas metas com seu nutricionista.</p></div>
 ${CLOUD&&USER?`<div class="card"><h3>${ic('user',22,'var(--p)')} Sua conta</h3><p class="mu" style="margin:10px 0 14px">${esc(USER.email||USER.displayName||'Conta conectada')}<br><span class="sm">Seus dados ficam salvos na sua conta e sincronizados entre aparelhos.</span></p><button class="btn sec" onclick="logout()">Sair da conta</button><button class="btn" style="margin-top:10px;background:var(--bad)" onclick="deleteAccount()">Excluir conta e dados</button></div>`:''}
 <div class="card"><h3>Seus dados</h3><p class="mu sm">${CLOUD?'Faça uma cópia de segurança quando quiser.':'Tudo fica salvo neste aparelho (banco de dados do navegador). Faça uma cópia de segurança de vez em quando.'}</p><button class="btn sec" onclick="exportData()">Copiar backup dos dados</button><button class="btn sec" style="margin-top:10px" onclick="importData()">Restaurar backup</button></div>${CLOUD?'':(()=>{const e=PROFILES.find(x=>x.id===CURP)||{};return `<div class="card"><h3>${ic('users',22,'var(--p)')} Perfis neste aparelho</h3><p class="mu sm" style="margin:8px 0 14px">${PROFILES.length} perfil(is) salvo(s). Cada pessoa vê só os próprios dados.</p>

 <p class="disc">MonMe 1.4 · Não substitui consulta médica.</p></div>`};
function exportData(){const t=JSON.stringify(S);const fb=()=>askText('Copie este texto e guarde:',t,()=>{},1);try{navigator.clipboard.writeText(t).then(()=>toast('Backup copiado'),fb)}catch(e){fb()}}

V.stats=()=>{
  const ws=S.weights.slice().sort((a,b)=>a.d.localeCompare(b.d));const p=S.profile;
  let ch='<div class="empty">Registre mais pesos para ver o gráfico.</div>';
  if(ws.length>=2){const t0=new Date(ws[0].d)-0,t1=Math.max(new Date(ws[ws.length-1].d)-0,t0+864e5);const vs=ws.map(w=>w.kg).concat([p.goalWeight]);const mn=Math.min(...vs)-1,mx=Math.max(...vs)+1;
   const X=t=>30+(t-t0)/(t1-t0)*280,Y=v=>150-(v-mn)/(mx-mn)*130;const path=ws.map((w,i)=>(i?'L':'M')+X(new Date(w.d)).toFixed(1)+' '+Y(w.kg).toFixed(1)).join(' ');
   ch=`<svg viewBox="0 0 320 170" width="100%"><line x1="30" x2="310" y1="${Y(p.goalWeight)}" y2="${Y(p.goalWeight)}" stroke="var(--ok)" stroke-dasharray="4 4"/><text x="310" y="${Y(p.goalWeight)-5}" font-size="10" text-anchor="end" fill="var(--ok)">meta ${nf1(p.goalWeight)}</text><text x="2" y="${Y(mx-1)+4}" font-size="10" fill="#999">${nf(mx-1,0)}</text><text x="2" y="${Y(mn+1)+4}" font-size="10" fill="#999">${nf(mn+1,0)}</text><path d="${path}" stroke="var(--p)" stroke-width="3" fill="none" stroke-linejoin="round"/>${ws.map(w=>`<circle cx="${X(new Date(w.d))}" cy="${Y(w.kg)}" r="3.5" fill="var(--p)"/>`).join('')}<text x="30" y="166" font-size="10" fill="#999">${dfmt(ws[0].d)}</text><text x="310" y="166" font-size="10" text-anchor="end" fill="#999">${dfmt(ws[ws.length-1].d)}</text></svg>`}
  const lost=p.startWeight-curWeight();const days=Math.max(1,(Date.now()-new Date(p.startDate||p.created))/864e5);
  return `<div class="scr">${header('Estatísticas')}<div class="card">${ch}</div><div class="card"><div class="between"><span>Total ${lost>=0?'perdido':'ganho'}</span><b>${nf1(Math.abs(lost))} kg</b></div><div class="hr"></div><div class="between"><span>Média semanal</span><b>${nf1(lost/days*7)} kg/sem</b></div><div class="hr"></div><div class="between"><span>Falta para a meta</span><b>${nf1(Math.max(0,curWeight()-p.goalWeight))} kg</b></div><div class="hr"></div><div class="between"><span>Aplicações registradas</span><b>${S.doses.length}</b></div></div>
  <div class="card"><h3>Histórico de peso</h3>${ws.slice().reverse().map(w=>`<div class="between" style="padding:10px 0;border-bottom:1px solid #EDF1F7"><span>${when(w.d)}</span><span class="row"><b>${nf1(w.kg)} kg</b><button onclick="delRec('weights','${w.id}')">${ic('trash',18,'#aaa')}</button></span></div>`).join('')}</div></div>`;
};

  <div class="tabs"><button class="${params.tab==='rec'?'on':''}" onclick="params.tab='rec';render()">Recentes</button><button class="${params.tab==='sav'?'on':''}" onclick="params.tab='sav';render()">Salvas</button></div>
  ${lst.length?lst.map((m,i)=>`<div class="list"><div class="it"><div class="t"><b>${esc(m.name)}</b><div class="mu sm">${nf(m.kcal,0)} kcal · P ${nf(m.p,0)}g · C ${nf(m.c,0)}g · G ${nf(m.f,0)}g</div></div>${params.tab==='rec'?`<button onclick="saveFav(${JSON.stringify(m.name).replace(/"/g,'&quot;')})">${ic('like',22,S.saved.some(s=>s.name===m.name)?'#D04545':'#bbb')}</button>`:`<button onclick="S.saved.splice(${i},1);save();render()">${ic('trash',20,'#aaa')}</button>`}<button class="plus" style="width:40px;height:40px" onclick='quickAdd(${JSON.stringify({name:m.name,portion:m.portion,kcal:m.kcal,p:m.p,c:m.c,f:m.f,fib:m.fib||0}).replace(/'/g,"&#39;")})'>${ic('plus',22)}</button></div></div>`).join(''):

function saveFav(name){const m=S.meals.slice().reverse().find(x=>x.name===name);if(!m)return;const i=S.saved.findIndex(s=>s.name===name);if(i>=0)S.saved.splice(i,1);else S.saved.push({name:m.name,portion:m.portion,kcal:m.kcal,p:m.p,c:m.c,f:m.f,fib:m.fib||0});save();render()}

V.mealSearch=()=>{

function planFor(m){

  else if(cur==='res')body=T('Você tem alguma restrição alimentar?','O plano nunca vai incluir nada daqui.')+`<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">${tile('res','nenhuma','👍','Não tenho restrições','nenhuma')}${RESTR.map(d=>tile('res',d[0],d[1],d[2],'nenhuma')).join('')}</div>`;
  else{const [m,n,e,qq,opts]=MQ[cur];ok=params.a[cur]!=null;body=`<h1 class="row" style="font-size:38px;gap:16px;margin:0 0 6px"><span style="font-size:40px">${e}</span>${n}</h1><p class="mu" style="font-size:18px;margin:0 0 22px">${qq}</p>`+opts.map(([t,sub],i)=>`<button class="opt ${params.a[cur]===i?'on':''}" onclick="params.a[${cur}]=${i};render()"><span style="text-align:left"><b style="font-size:18px">${t}</b><br><span class="mu">${sub}</span></span><span class="box">${params.a[cur]===i?ic('check',18,'#fff',2.4):''}</span></button>`).join('')}
  return `<div class="scr" style="padding-bottom:130px"><div class="row" style="margin:6px 0 30px"><button onclick="if(params.s>0){params.s--;render()}else back()">${ic('back',28)}</button><div class="steps"><i style="width:${(params.s+1)/st.length*100}%"></i></div></div>${body}
  <div class="obf"><button class="btn" ${ok?'':'disabled'} onclick="mwNext()">${last?'Gerar meu plano':'Continuar'}</button></div></div>`;
};
V.menuLoading=()=>{
  const g=goals();const k=params.k||0;
  const st=[['check','Lendo suas respostas',((S.menu&&S.menu.meals)||SLOTS).length+' refeições por dia'],['trend','Calibrando na sua meta',nf(g.kcal,0)+' kcal e '+g.prot+' g de proteína por dia'],['fork','Montando suas refeições','Do jeito que você já come'],['sort','Criando alternativas','Várias opções de receitas por refeição'],['search','Conferindo os valores nutricionais','Consultando a base de alimentos']];
  if(k<st.length)setTimeout(()=>{if(view==='menuLoading'){params.k=k+1;render()}},750);
  else setTimeout(()=>{if(view==='menuLoading'){Hist.replaceState({v:'menuView',p:{},tab});view='menuView';params={};render()}},400);
  return `<div class="scr" style="padding-top:9vh"><div class="logo" style="width:96px;height:96px">${ic('spark',44,'#fff',1.6)}</div><h1 style="text-align:center;font-size:40px;margin:26px 0 6px">Montando seu plano</h1><p class="mu" style="text-align:center;font-size:17px;margin:0 20px 34px">Personalizado para as suas metas e os seus gostos</p>
  ${st.map((x,i)=>`<div class="row" style="gap:16px;margin-bottom:20px;opacity:${i<=k?1:.4};transition:opacity .4s"><span style="width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;background:${i<k?'linear-gradient(135deg,#2A6BDA,#0B4DB8)':'var(--pl)'}">${ic(x[0],26,i<k?'#fff':'var(--p)')}</span><span style="flex:1"><b style="font-size:17px">${x[1]}</b><br><span class="mu">${x[2]}</span><span style="display:block;height:3px;border-radius:3px;margin-top:10px;background:var(--li);overflow:hidden"><i style="display:block;height:100%;width:${i<k?100:i===k?55:0}%;background:var(--p2);transition:width .7s"></i></span></span></div>`).join('')}</div>`;
};
function mealCard(r,m){const t=mTarget(m);return `<button onclick="go('menuRecipe',{id:'${r[0]}',m:'${m}'})" style="flex:none;width:150px;text-align:left"><span style="display:flex;width:150px;height:150px;border-radius:26px;background:#fff;box-shadow:0 4px 18px rgba(11,77,184,.1);align-items:center;justify-content:center;font-size:66px">${r[3]}</span><span style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:10px;font-size:15px;font-weight:500;line-height:1.3">${r[2]}</span><span class="mu sm">~${t} kcal · ${Math.round(r[5]*t/r[4])} g prot.</span></button>`}
V.menuView=()=>{
  if(!S.menu||!S.menu.a)return V.menuWizard();
  const g=goals();
  const sel=S.menu.meals||SLOTS.map(x=>x[0]);const sec=SLOTS.filter(x=>sel.includes(x[0])).map(([m,n,e,ty])=>{const t=mTarget(m);let rs=planFor(ty);if(m==='lt')rs=rs.slice(3).concat(rs.slice(0,3));return `<div class="between" style="margin-top:26px"><h2 style="margin:0;font-size:26px">${e} ${n}</h2><button class="chip" style="margin:0;padding:8px 14px;font-size:14px;color:var(--p)" onclick="go('menuMeal',{m:'${m}'})">Ver todas</button></div><p class="mu" style="margin:4px 0 12px">refeições de ${Math.round(t*.92)} a ${Math.round(t*1.05)} kcal</p>${rs.length?`<div style="display:flex;gap:14px;overflow-x:auto;padding:4px 2px 10px;margin:0 -16px;padding-left:16px;scrollbar-width:none">${rs.slice(0,6).map(r=>mealCard(r,m)).join('')}<span style="flex:none;width:4px"></span></div>`:'<div class="card mu sm">Nenhuma receita combina com suas restrições nesta refeição. Refaça o questionário para ajustar.</div>'}`}).join('');
  return `<div class="scr"><div class="bar"><button class="round" onclick="back()">${ic('back')}</button></div><h1 style="font-size:40px;margin:0">Seu plano alimentar</h1><p class="mu" style="margin:4px 0 18px;font-size:17px">Feito para você</p>
  <div class="card" style="display:flex;justify-content:space-around;text-align:center;background:linear-gradient(135deg,#EAF1FD,#FFF5DB);border:0">${[[nf(g.kcal,0),'kcal'],[g.prot+'g','proteína'],[g.carb+'g','carbo'],[g.fat+'g','gordura']].map(([v,l])=>`<div><div style="font-size:22px;font-weight:500">${v}</div><div class="mu sm">${l}</div></div>`).join('')}</div>
  ${sec}<button class="btn out" style="margin-top:24px" onclick="Hist.replaceState({v:'menuWizard',p:{},tab});view='menuWizard';params={};render()">Refazer questionário</button><p class="disc">Sugestões gerais. Para um plano individual, procure um(a) nutricionista.</p></div>`;
};
V.menuMeal=({m})=>{const [_,n,e,ty]=slotOf(m);const t=mTarget(m);return `<div class="scr">${header(e+' '+n)}${planFor(ty).map(r=>`<button class="recipe" style="width:100%;text-align:left" onclick="go('menuRecipe',{id:'${r[0]}',m:'${m}'})"><span class="em">${r[3]}</span><span style="flex:1"><b style="font-size:16px">${r[2]}</b><br><span class="mu sm">~${t} kcal · ${Math.round(r[5]*t/r[4])} g proteína</span></span>${ic('chev',20,'#A8B4C8')}</button>`).join('')}</div>`};
V.menuRecipe=({id,m})=>{const r=MDB.find(x=>x[0]===id);const sl=slotOf(m);const t=mTarget(m);const f=t/r[4];
 return `<div class="scr">${header('')}<div style="width:150px;height:150px;margin:0 auto;border-radius:40px;background:#fff;box-shadow:0 6px 22px rgba(11,77,184,.12);display:flex;align-items:center;justify-content:center;font-size:76px">${r[3]}</div><h1 style="text-align:center;margin:18px 0 6px">${r[2]}</h1>
 <div class="card" style="display:flex;justify-content:space-around;text-align:center;margin-top:16px">${[[t,'kcal'],[Math.round(r[5]*f)+'g','proteína'],[Math.round(r[6]*f)+'g','carbo'],[Math.round(r[7]*f)+'g','gordura']].map(([v,l])=>`<div><div style="font-size:20px;font-weight:500">${v}</div><div class="mu sm">${l}</div></div>`).join('')}</div>
 ${Math.abs(f-1)>.12?`<p class="mu sm" style="text-align:center;margin-top:-4px">Porção ajustada para a sua meta: ${nf(f,1)}× a receita base</p>`:''}
 <div class="card"><h3>Ingredientes</h3><ul style="line-height:1.9;padding-left:20px;margin:10px 0 0">${r[9].map(x=>`<li>${x}</li>`).join('')}</ul></div>
 <div class="card"><h3>Modo de preparo</h3><ol style="line-height:1.7;padding-left:20px;margin:10px 0 0">${r[10].split('|').map(x=>`<li style="margin-bottom:6px">${x}</li>`).join('')}</ol></div>
 <button class="btn" onclick="S.meals.push({id:uid(),d:new Date().toISOString(),type:'${sl[3]}',name:'${r[2].replace(/'/g,"\\'")}',portion:'1 porção',kcal:${t},p:${Math.round(r[5]*f)},c:${Math.round(r[6]*f)},f:${Math.round(r[7]*f)},fib:3});save();toast('Registrado em ${sl[1]} ✓')">Comi essa refeição hoje</button></div>`};

/* ===== Platô ===== */
const PLQ=[['Há quanto tempo seu peso está parado?',['Menos de 2 semanas','2 a 4 semanas','Mais de 1 mês']],['Você está batendo a meta de proteína?',['Quase todo dia','Às vezes','Raramente']],['Quanta água você bebe por dia?',['Mais de 2,5 L','1,5 a 2,5 L','Menos de 1,5 L']],['Faz treino de força (musculação/funcional)?',['3x ou mais por semana','1–2x por semana','Não faço']],['Como está seu sono?',['7h ou mais','5 a 7h','Menos de 5h']]];
V.plateau=()=>{
  if(params.s==null){params.s=0;params.a=[]}
  if(params.s>=PLQ.length){const a=params.a;const tips=[];
   if(a[0]===0)tips.push(['⏳','Paciência: oscilações de 1–2 semanas são normais (água, intestino, ciclo hormonal). Olhe a média e as medidas.']);
   if(a[1]>0)tips.push(['🍗','Priorize proteína em toda refeição — ajuda a manter massa magra e saciedade. Meta: '+goals().prot+' g/dia.']);
   if(a[2]>0)tips.push(['💧','Aumente a água para ~'+nf(goals().water/1000)+' L/dia; ajuda também no intestino.']);
   if(a[3]>0)tips.push(['🏋️','Inclua treino de força 2–3x por semana. Músculo ajuda o metabolismo e muda a composição corporal.']);
   if(a[4]>0)tips.push(['😴','Sono curto aumenta a fome e a retenção. Tente uma rotina de 7h+.']);
   tips.push(['📝','Registre tudo por 7 dias: calorias “escondidas” (bebidas, beliscos, molhos) costumam aparecer.']);
   if(a[0]===2)tips.push(['🩺','Mais de 1 mês sem mudança: vale conversar com seu médico sobre o tratamento.']);
   return `<div class="scr">${header('Seu plano')}${tips.map(t=>`<div class="card row" style="align-items:flex-start"><span style="font-size:30px">${t[0]}</span><span style="line-height:1.5">${t[1]}</span></div>`).join('')}<button class="btn" onclick="back()">Entendi</button></div>`}
  const [q,o]=PLQ[params.s];
  return `<div class="scr"><div class="row" style="margin:6px 0 30px"><button onclick="if(params.s>0){params.s--;render()}else back()">${ic('back',28)}</button><div class="steps"><i style="width:${(params.s+1)/PLQ.length*100}%"></i></div></div><h1 style="font-size:28px">${q}</h1>${o.map((t,i)=>`<button class="opt" onclick="params.a[${params.s}]=${i};params.s++;Hist.replaceState({v:view,p:params,tab},'');render()"><b>${t}</b>${ic('chev',20,'#999')}</button>`).join('')}</div>`;
};

/* ===== Assistente Mia (offline) ===== */
const KB=[
 [/rotacion|local da (aplica|inje)|onde aplic/,'Sim! Alternar o local ajuda a evitar irritação e nódulos na pele. Os locais comuns são abdômen (a uns 5 cm do umbigo), coxa e parte de trás do braço. Uma regra simples: mude de lado ou de região a cada aplicação. O MonMe sugere o próximo local quando você registra a dose. Siga sempre a orientação do seu médico.'],
 [/enjo|n[aá]usea|v[oô]mit/,'Para aliviar o enjoo:\n• Coma porções pequenas e devagar, pare ao sentir saciedade\n• Evite frituras e comidas muito gordurosas, principalmente no dia da aplicação\n• Beba água em goles ao longo do dia\n• Alimentos frios ou secos (torrada, biscoito de água) costumam cair melhor\n• Gengibre e chá podem ajudar\n\n⚠️ Vômitos repetidos, dor abdominal forte ou sinais de desidratação: procure atendimento médico.'],
 [/intestin|constip|pris[aã]o|preso|evacua/,'Para o intestino preso:\n• Beba mais água (sua meta está no card Água)\n• Aumente fibras aos poucos: frutas com casca, legumes, aveia, feijão\n• Movimente-se — caminhadas ajudam muito\n• Mantenha horários regulares\n\nSe ficar mais de 3–4 dias sem evacuar ou houver dor forte, fale com seu médico.'],
 [/diarr/,'Na diarreia: hidrate-se bem (água, soro caseiro ou de farmácia), prefira alimentos leves como arroz, banana, frango cozido e evite gordura, leite e cafeína por um tempo. Se durar mais de 2 dias, tiver sangue ou febre, procure atendimento.'],
 [/efeito|colater/,'Dicas gerais para reduzir efeitos colaterais:\n• Coma devagar e em porções menores\n• Priorize proteína e reduza gordura e açúcar\n• Hidrate-se bem\n• Não deite logo após comer\n• Registre sintomas aqui no app — isso ajuda seu médico a ajustar o tratamento\n\nNunca altere a dose por conta própria.'],
 [/prote[ií]n/,'Proteína é essencial no tratamento: ajuda a preservar massa muscular e dá saciedade. Sua meta no MonMe é ~{prot} g por dia. Boas fontes: ovos, frango, peixe, carne magra, iogurte grego, queijo branco, whey e leguminosas. Tente incluir proteína em todas as refeições.'],
 [/treino|exerc|muscula|academia/,'Para sua fase: combine caminhada (150 min por semana, divididos como preferir) com treino de força 2–3x por semana. A musculação ajuda a manter o músculo enquanto você perde gordura. Comece leve, foque na técnica e aumente aos poucos. Registre seus treinos em Atividades!'],
 [/receita|comer|card[aá]pio|refei/,'Tenho algumas receitas leves e com bastante proteína em Nutrição → Receitas. Uma rápida: crepioca de frango — 1 ovo + 2 col. de goma de tapioca, doure na frigideira e recheie com frango desfiado (~280 kcal, 25 g de proteína). Também posso montar um cardápio do dia em Nutrição → Criar cardápio.'],
 [/esqueci|perdi a dose|atras/,'Se você esqueceu uma dose, a conduta depende do medicamento e de quanto tempo passou — cada bula tem uma regra própria. Confira a bula ou fale com seu médico/farmacêutico antes de aplicar. Não aplique duas doses juntas para compensar.'],
 [/dose|aumentar|subir|mg/,'Ajustes de dose devem ser feitos apenas pelo seu médico, normalmente de forma gradual. Para saber quantas unidades puxar na seringa para a dose prescrita, use a Calculadora de doses na aba Doses.'],
 [/[aá]gua|hidrat/,'Sua meta de água é {agua} L por dia. Dica: deixe uma garrafa sempre à vista e marque os copos no card Água da tela inicial.'],
 [/plat[oô]|parou|estag|n[aã]o emagre/,'Platôs são normais! Faça o teste “Seu peso deu uma parada?” na aba Perfil — em 2 minutos você recebe dicas personalizadas. Lembre de olhar também as medidas de cintura e quadril.'],
 [/[aá]lcool|cerveja|vinho|bebida/,'Álcool tem muitas calorias, pode piorar enjoo e hipoglicemia em algumas pessoas e atrapalha o sono. Se for beber, prefira pouca quantidade, junto com comida e muita água — e confirme com seu médico se é seguro no seu caso.'],
 [/cabelo/,'Queda de cabelo pode acontecer com perda de peso rápida (não só pelo remédio). Garanta proteína suficiente, ferro, zinco e vitaminas. Se for intensa, converse com seu médico ou dermatologista.'],
];
function miaAnswer(q){
  const t=q.toLowerCase();const g=goals();
  for(const [re,a] of KB)if(re.test(t))return a.replace('{prot}',g.prot).replace('{agua}',nf(g.water/1000));
  if(/^(oi|ol[aá]|bom dia|boa tarde|boa noite)/.test(t))return 'Oi, '+S.profile.name.split(' ')[0]+'! 💜 Posso ajudar com dúvidas sobre aplicação, enjoo, intestino, alimentação, proteína, treinos e mais. O que você quer saber?';
  return 'Ainda não sei responder isso com segurança. 😊 Posso ajudar com: local da aplicação, enjoo, intestino, efeitos colaterais, proteína, água, treinos, receitas e platô. Para questões sobre o seu tratamento, fale sempre com seu médico.';
}
V.chat=()=>{
  if(params.q&&!params.sent){params.sent=1;Hist.replaceState({v:view,p:params,tab},'');setTimeout(()=>sendChat(params.q),50)}
  const msgs=S.chat.slice(-40);
  return `<div class="scr chatwrap" style="padding-bottom:0"><div class="bar"><button class="round" onclick="back()">${ic('back')}</button><h2 style="margin:0;text-align:left">Assistente Mia</h2><button class="round" onclick="ask('Começar uma nova conversa?',()=>{S.chat=[];save();render()},'Limpar')">${ic('plus')}</button></div>
  <div class="msgs" id="msgs">${msgs.length?msgs.map(m=>`<div class="msg ${m.me?'me':'bot'}">${esc(m.t)}</div>`).join(''):`<div style="text-align:center;padding-top:6vh"><img src="${LOGO}" style="width:150px"><h2 style="font-size:28px;margin:18px 0 8px">Como posso te ajudar, ${esc(S.profile.name.split(' ')[0])}?</h2><p class="mu" style="font-size:17px;line-height:1.5">Tire dúvidas sobre tratamento, alimentação, treino ou sintomas.</p></div><div style="margin-top:30px">${[['🍲','Crie uma receita para mim'],['🏋️','Ideias de treino pra minha fase'],['💊','Esqueci minha dose, e agora?'],['💛','Estou sentindo enjoo']].map(([e,t])=>`<button class="chip" style="background:#fff;font-size:17px;padding:14px 18px" onclick="sendChat('${t}')">${e} ${t}</button>`).join('')}</div>`}</div>
  <div class="composer"><div class="cbox"><input id="ci" placeholder="Pergunte qualquer coisa…" onkeydown="if(event.key==='Enter')sendChat(this.value)"><button class="send" onclick="sendChat(document.getElementById('ci').value)">${ic('send',22,'#fff')}</button></div><div class="disc">A Mia funciona offline e não substitui consulta médica.</div></div></div>`;
};
function sendChat(t){t=(t||'').trim();if(!t)return;S.chat.push({me:1,t});save();render();setTimeout(()=>{S.chat.push({t:miaAnswer(t)});save();if(view==='chat'){render();window.scrollTo(0,document.body.scrollHeight)}},500);window.scrollTo(0,document.body.scrollHeight)}

/* ============ Início ============ */
boot();
</script>
<script>
/* Funciona offline se existir um sw.js ao lado (opcional) */
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
/* Botão de instalar */
(function(){var dp=null,isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
if(standalone||location.protocol==='file:')return;
function bar(html,onclick){if(document.getElementById('instbar'))return;var d=document.createElement('div');d.id='instbar';
d.style.cssText='position:fixed;left:12px;right:12px;top:12px;z-index:90;background:#fff;border-radius:20px;box-shadow:0 8px 28px rgba(11,77,184,.22);padding:12px 14px;display:flex;gap:12px;align-items:center;font-family:Quicksand,sans-serif;max-width:496px;margin:0 auto';
d.innerHTML='<img src="'+document.querySelector('link[rel=icon]').href+'" style="width:42px;height:42px;border-radius:10px"><div style="flex:1;font-size:14px;color:#1F2A44">'+html+'</div><button id="instgo" style="background:#0B4DB8;color:#fff;border:0;border-radius:999px;padding:9px 14px;font-weight:600;font-family:inherit">'+(onclick?'Instalar':'Ok')+'</button><button id="instx" style="border:0;background:none;font-size:20px;color:#8A94A8">×</button>';
document.body.appendChild(d);document.getElementById('instx').onclick=function(){d.remove();try{localStorage.setItem('monme_inst_hide','1')}catch(e){}};
document.getElementById('instgo').onclick=function(){if(onclick)onclick();d.remove()}}
try{if(localStorage.getItem('monme_inst_hide'))return}catch(e){}
window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();dp=e;bar('<b>Instale o MonMe</b><br>Fica na tela inicial como um app.',function(){dp.prompt()})});
if(isIOS)setTimeout(function(){bar('<b>Instale o MonMe:</b> toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>.',null)},2500);
})();
</script>
